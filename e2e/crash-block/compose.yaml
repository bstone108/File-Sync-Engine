name: fse-crash-block
services:
  mac:
    image: file-sync-engine:e2e
    hostname: mac
    environment:
      FSE_NODE_NAME: mac
      FSE_ADVERTISE_URL: https://mac:22420
      FSE_DISCOVERY_DHT: "false"
      FSE_DISCOVERY_LOCAL: "false"
    ports:
      - "22701:22420"
    volumes:
      - mac-config:/config
      - mac-data:/data
    networks:
      crash:
        ipv4_address: 172.30.61.10
  windows:
    image: file-sync-engine:e2e
    hostname: windows
    environment:
      FSE_NODE_NAME: windows
      FSE_ADVERTISE_URL: https://windows:22420
      FSE_DISCOVERY_DHT: "false"
      FSE_DISCOVERY_LOCAL: "false"
    ports:
      - "22702:22420"
    volumes:
      - windows-config:/config
      - windows-data:/data
    networks:
      crash:
        ipv4_address: 172.30.61.11
  unraid-a:
    image: file-sync-engine:e2e
    hostname: unraid-a
    cap_add:
      - NET_ADMIN
    entrypoint: ["/bin/sh", "-c"]
    command: ["apk add --no-cache iproute2 >/tmp/apk.log && tc qdisc add dev eth0 root tbf rate 8mbit burst 64kb latency 400ms && exec /usr/local/bin/fse-container-entrypoint start"]
    environment:
      FSE_NODE_NAME: unraid-a
      FSE_ADVERTISE_URL: https://unraid-a:22420
      FSE_DISCOVERY_DHT: "false"
      FSE_DISCOVERY_LOCAL: "false"
    ports:
      - "22703:22420"
    volumes:
      - unraid-a-config:/config
      - unraid-a-data:/data
    networks:
      crash:
        ipv4_address: 172.30.61.12
  unraid-b:
    image: file-sync-engine:e2e
    hostname: unraid-b
    environment:
      FSE_NODE_NAME: unraid-b
      FSE_ADVERTISE_URL: https://unraid-b:22420
      FSE_DISCOVERY_DHT: "false"
      FSE_DISCOVERY_LOCAL: "false"
    ports:
      - "22704:22420"
    volumes:
      - unraid-b-config:/config
      - unraid-b-data:/data
    networks:
      crash:
        ipv4_address: 172.30.61.13
  unraid-share:
    image: file-sync-engine:e2e
    hostname: unraid-share
    environment:
      FSE_NODE_NAME: unraid-share
      FSE_ADVERTISE_URL: https://unraid-share:22420
      FSE_DISCOVERY_DHT: "false"
      FSE_DISCOVERY_LOCAL: "false"
    ports:
      - "22705:22420"
    volumes:
      - unraid-share-config:/config
      - unraid-share-data:/data
    networks:
      crash:
        ipv4_address: 172.30.61.14
volumes:
  mac-config:
  mac-data:
  windows-config:
  windows-data:
  unraid-a-config:
  unraid-a-data:
  unraid-b-config:
  unraid-b-data:
  unraid-share-config:
  unraid-share-data:
networks:
  crash:
    ipam:
      config:
        - subnet: 172.30.61.0/24

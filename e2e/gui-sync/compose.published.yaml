name: fse-published
services:
  published-a:
    image: file-sync-engine:e2e
    hostname: published-a
    networks: [net-a]
    extra_hosts:
      - "published-a:172.30.29.1"
      - "published-b:172.30.29.1"
    environment:
      FSE_NODE_NAME: published-a
      FSE_ADVERTISE_URL: https://published-a:22420
      FSE_PUBLISHED_API_PORT: "22420"
      FSE_LIBP2P_PORT: "22421"
      FSE_PUBLISHED_LIBP2P_PORT: "22421"
      FSE_LIBP2P_DHT_MODE: server
      FSE_LIBP2P_PRIVATE_KEY: "CAESQEJDZ+N7os4cl6ICoZdZTNr5kYkeVxBxnQHp0WD798pTTu5F0fYA5fqAt9f59jrDBJ8m/Z3zpnUPmtq5Di9ml+E="
      FSE_DHT_BOOTSTRAP_PEERS: "/ip4/172.30.29.1/tcp/22423/p2p/12D3KooWR2CG2NKZoAJoUyzULR6JgFgjTTeBEAVXx9qjN7gWGJUY"
      FSE_WEB_GUI_ENABLED: "true"
      FSE_WEB_GUI_VERSION: ${FSE_WEB_GUI_VERSION:-0.0.0-dev}
      FSE_WEB_GUI_PACKAGE: /opt/fse/web-package/fse-web-gui.zip
      FSE_WEB_GUI_INSTALL_DIR: /config/web-gui
      FSE_WEB_GUI_LISTEN: 0.0.0.0:8385
      FSE_WEB_GUI_CHECKSUM: ${FSE_WEB_GUI_CHECKSUM:?Set FSE_WEB_GUI_CHECKSUM}
      FSE_SYNC_LISTEN: tcp://0.0.0.0:22000
    ports:
      - "8387:8385"
      - "22420:22420"
      - "22421:22421/tcp"
      - "22421:22421/udp"
    volumes:
      - published-a-config:/config
      - published-a-data:/data
      - ${FSE_WEB_GUI_PACKAGE_HOST_PATH:?Set FSE_WEB_GUI_PACKAGE_HOST_PATH}:/opt/fse/web-package/fse-web-gui.zip:ro
  published-b:
    image: file-sync-engine:e2e
    hostname: published-b
    networks: [net-b]
    extra_hosts:
      - "published-a:172.30.30.1"
      - "published-b:172.30.30.1"
    environment:
      FSE_NODE_NAME: published-b
      FSE_ADVERTISE_URL: https://published-b:22430
      FSE_PUBLISHED_API_PORT: "22430"
      FSE_LIBP2P_PORT: "22421"
      FSE_PUBLISHED_LIBP2P_PORT: "22423"
      FSE_LIBP2P_DHT_MODE: server
      FSE_LIBP2P_PRIVATE_KEY: "CAESQDQ9376sCfNac9Rj4MoZUTuiw9Ji8hmj72kCS/21tYCr4ecRysJOVPuyHKUUF65i14hdNi7Lij49i9XayzSLWCk="
      FSE_DHT_BOOTSTRAP_PEERS: "/ip4/172.30.30.1/tcp/22421/p2p/12D3KooWF8UhVBmTEmqqbEjYg9wdQpV7E8KzAoXj7vBHrnDWBkrU"
      FSE_WEB_GUI_ENABLED: "true"
      FSE_WEB_GUI_VERSION: ${FSE_WEB_GUI_VERSION:-0.0.0-dev}
      FSE_WEB_GUI_PACKAGE: /opt/fse/web-package/fse-web-gui.zip
      FSE_WEB_GUI_INSTALL_DIR: /config/web-gui
      FSE_WEB_GUI_LISTEN: 0.0.0.0:8385
      FSE_WEB_GUI_CHECKSUM: ${FSE_WEB_GUI_CHECKSUM:?Set FSE_WEB_GUI_CHECKSUM}
      FSE_SYNC_LISTEN: tcp://0.0.0.0:22000
    ports:
      - "8388:8385"
      - "22430:22420"
      - "22423:22421/tcp"
      - "22423:22421/udp"
    volumes:
      - published-b-config:/config
      - published-b-data:/data
      - ${FSE_WEB_GUI_PACKAGE_HOST_PATH}:/opt/fse/web-package/fse-web-gui.zip:ro
volumes:
  published-a-config:
  published-b-config:
  published-a-data:
  published-b-data:
networks:
  net-a:
    ipam:
      config:
        - subnet: 172.30.29.0/24
          gateway: 172.30.29.1
  net-b:
    ipam:
      config:
        - subnet: 172.30.30.0/24
          gateway: 172.30.30.1

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Go tests and serious harness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run Go tests
        run: go test ./...
      - name: Run serious harness
        run: scripts/run-serious-harness.sh

  daemon-cross-compile:
    name: Daemon ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            GOOS: linux
            GOARCH: amd64
          - target: linux-arm64
            GOOS: linux
            GOARCH: arm64
          - target: darwin-amd64
            GOOS: darwin
            GOARCH: amd64
          - target: darwin-arm64
            GOOS: darwin
            GOARCH: arm64
          - target: windows-amd64
            GOOS: windows
            GOARCH: amd64
          - target: windows-arm64
            GOOS: windows
            GOARCH: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Cross-compile daemon
        env:
          GOOS: ${{ matrix.GOOS }}
          GOARCH: ${{ matrix.GOARCH }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist/${{ matrix.target }}
          suffix=""
          if [ "$GOOS" = "windows" ]; then suffix=".exe"; fi
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA}" -o "dist/${{ matrix.target }}/fse-${{ matrix.target }}${suffix}" ./cmd/fse
      - name: Upload daemon artifact
        uses: actions/upload-artifact@v4
        with:
          name: file-sync-engine-daemon-${{ matrix.target }}-${{ github.sha }}
          path: dist/${{ matrix.target }}/
          if-no-files-found: error

  build-all-smoke:
    name: scripts/build-all.sh smoke
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run build-all script
        run: scripts/build-all.sh "ci-${GITHUB_SHA::12}"

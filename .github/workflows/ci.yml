name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Go tests and serious harness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify Windows Wails build-gate contract
        run: python3 scripts/test_windows_wails_ci_contract.py
      - name: Verify unsigned macOS Wails build-gate contract
        run: python3 scripts/test_macos_wails_ci_contract.py
      - name: Run Go tests
        run: go test ./...
      - name: Run serious harness
        run: scripts/run-serious-harness.sh

  daemon-cross-compile:
    name: Daemon ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            GOOS: linux
            GOARCH: amd64
          - target: linux-arm64
            GOOS: linux
            GOARCH: arm64
          - target: linux-armv7
            GOOS: linux
            GOARCH: arm
            GOARM: 7
          - target: darwin-amd64
            GOOS: darwin
            GOARCH: amd64
          - target: darwin-arm64
            GOOS: darwin
            GOARCH: arm64
          - target: windows-amd64
            GOOS: windows
            GOARCH: amd64
          - target: windows-arm64
            GOOS: windows
            GOARCH: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Cross-compile daemon
        env:
          GOOS: ${{ matrix.GOOS }}
          GOARCH: ${{ matrix.GOARCH }}
          GOARM: ${{ matrix.GOARM }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist/${{ matrix.target }}
          suffix=""
          if [ "$GOOS" = "windows" ]; then suffix=".exe"; fi
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA}" -o "dist/${{ matrix.target }}/fse-${{ matrix.target }}${suffix}" ./cmd/fse
      - name: Upload daemon artifact
        uses: actions/upload-artifact@v7
        with:
          name: file-sync-engine-daemon-${{ matrix.target }}-${{ github.sha }}
          path: dist/${{ matrix.target }}/
          if-no-files-found: error

  macos-desktop-wails-build:
    name: macOS native Wails desktop build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: darwin/amd64
            runner: macos-15-intel
          - arch: arm64
            platform: darwin/arm64
            runner: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: desktop-gui/go.mod
          cache: true
          cache-dependency-path: desktop-gui/go.sum
      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-gui/package-lock.json
      - name: Fetch Sparkle.framework
        run: scripts/fetch-sparkle-framework.sh
      - name: Build unsigned native macOS desktop application
        working-directory: desktop-gui
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2
          export PATH="$(go env GOPATH)/bin:$PATH"
          export FSE_DESKTOP_VERSION="ci-${GITHUB_SHA::12}"
          ../scripts/stamp-desktop-gui-version.sh "$FSE_DESKTOP_VERSION" .
          export DYLD_FRAMEWORK_PATH="$(cd third_party/sparkle && pwd)${DYLD_FRAMEWORK_PATH:+:$DYLD_FRAMEWORK_PATH}"
          wails generate module
          npm ci
          npm run typecheck
          npm run build
          export CGO_LDFLAGS="${CGO_LDFLAGS:+$CGO_LDFLAGS }-Wl,-rpath,@executable_path/../Frameworks"
          wails build -clean -platform "${{ matrix.platform }}" -o fse-desktop
          app_bundle="$(find build/bin -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "$app_bundle" || ! -x "$app_bundle/Contents/MacOS/fse-desktop" ]]; then
            printf 'Wails reported success but the macOS .app is missing\n' >&2
            find build/bin -maxdepth 3 -print >&2 || true
            exit 1
          fi
          mkdir -p "$app_bundle/Contents/Frameworks"
          cp -R third_party/sparkle/Sparkle.framework "$app_bundle/Contents/Frameworks/Sparkle.framework"
          ../scripts/add-macos-sparkle-rpath.sh "$app_bundle"

  windows-desktop-wails-build:
    name: Windows native Wails desktop build
    runs-on: windows-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: desktop-gui/go.mod
          cache: true
          cache-dependency-path: desktop-gui/go.sum
      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-gui/package-lock.json
      - name: Build native Windows desktop application
        shell: pwsh
        working-directory: desktop-gui
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2
          $env:Path = "$(go env GOPATH)\\bin;$env:Path"
          wails generate module
          npm ci
          npm run typecheck
          npm run build
          wails build -clean -platform windows/amd64 -o fse-desktop.exe
          if (-not (Test-Path build/bin/fse-desktop.exe)) {
            throw "Wails reported success but build/bin/fse-desktop.exe is missing"
          }

  windows-desktop-wails-smoke:
    name: Windows native desktop lifecycle smoke
    runs-on: windows-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-gui/package-lock.json
      - name: Build and smoke-test native Windows desktop lifecycle
        shell: pwsh
        run: |
          go build -trimpath -o fse.exe ./cmd/fse
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2
          $env:Path = "$(go env GOPATH)\\bin;$env:Path"
          Push-Location desktop-gui
          wails generate module
          npm ci
          npm run typecheck
          npm run build
          wails build -clean -platform windows/amd64 -o fse-desktop.exe
          Pop-Location
          & scripts/windows-desktop-smoke.ps1 -EnginePath fse.exe -DesktopSource desktop-gui

  build-all-smoke:
    name: scripts/build-all.sh smoke
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Run build-all script
        run: scripts/build-all.sh "ci-${GITHUB_SHA::12}"

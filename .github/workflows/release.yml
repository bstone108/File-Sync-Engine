name: Release artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Optional published release version YYYY.M.D.N (unpadded, America/Chicago date.build). Leave empty to auto-stamp the next N for today's Chicago calendar day. Tag pushes use the tag name.
        required: false
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  version-preflight:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(scripts/resolve-release-version.sh "${{ inputs.version }}")"
          tag="v${version}"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Refuse duplicate release version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          tag="${{ steps.version.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            printf 'refusing to build duplicate release version %s: GitHub release %s already exists\n' "$version" "$tag" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE:-}" != "tag" ]]; then
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              printf 'refusing to build duplicate release version %s: remote tag %s already exists\n' "$version" "$tag" >&2
              exit 1
            fi
          fi
          # Historical tags were zero-padded YYYY.MM.DD.NN. Refuse that spelling
          # of the same date.build so an unpadded stamp cannot collide with it.
          IFS=. read -r year month day n <<<"$version"
          padded_tag="$(printf 'v%d.%02d.%02d.%02d' "$((10#$year))" "$((10#$month))" "$((10#$day))" "$((10#$n))")"
          if [[ "$padded_tag" != "$tag" ]]; then
            if gh release view "$padded_tag" >/dev/null 2>&1; then
              printf 'refusing to build duplicate release version %s: GitHub release %s already exists\n' "$version" "$padded_tag" >&2
              exit 1
            fi
            if [[ "${GITHUB_REF_TYPE:-}" != "tag" ]]; then
              if git ls-remote --exit-code --tags origin "refs/tags/$padded_tag" >/dev/null 2>&1; then
                printf 'refusing to build duplicate release version %s: remote tag %s already exists\n' "$version" "$padded_tag" >&2
                exit 1
              fi
            fi
          fi

  linux-release-artifacts:
    needs: version-preflight
    name: Linux daemon artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version
        id: version
        shell: bash
        run: |
          version="${{ needs.version-preflight.outputs.version }}"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Build cross-platform daemon binaries
        run: scripts/build-all.sh "${{ steps.version.outputs.version }}"

      - name: Upload linux amd64 daemon artifact
        uses: actions/upload-artifact@v7
        with:
          name: file-sync-engine-daemon-linux-amd64-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: |
            build/${{ steps.version.outputs.version }}/fse-linux-amd64
            build/${{ steps.version.outputs.version }}/SHA256SUMS
          if-no-files-found: error

      - name: Upload linux arm64 daemon artifact
        uses: actions/upload-artifact@v7
        with:
          name: file-sync-engine-daemon-linux-arm64-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: |
            build/${{ steps.version.outputs.version }}/fse-linux-arm64
            build/${{ steps.version.outputs.version }}/SHA256SUMS
          if-no-files-found: error

      - name: Upload linux armv7 daemon artifact
        uses: actions/upload-artifact@v7
        with:
          name: file-sync-engine-daemon-linux-armv7-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: |
            build/${{ steps.version.outputs.version }}/fse-linux-armv7
            build/${{ steps.version.outputs.version }}/SHA256SUMS
          if-no-files-found: error

  web-gui-package:
    needs: version-preflight
    name: Verify optional web GUI package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify separately delivered web GUI package
        shell: bash
        run: unzip -t web-gui/dist/fse-web-container-default.zip

      - name: Upload optional web GUI package
        uses: actions/upload-artifact@v7
        with:
          name: fse-web-gui-package-${{ needs.version-preflight.outputs.version }}-${{ github.sha }}
          path: web-gui/dist/fse-web-container-default.zip
          if-no-files-found: error

  linux-desktop-artifacts:
    needs: version-preflight
    name: Linux desktop installer artifacts (${{ matrix.target }} ${{ matrix.webkit_slug }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            goarch: amd64
            runner: ubuntu-latest
            appimagetool: appimagetool-x86_64.AppImage
            webkit_api: '4.1'
            webkit_slug: webkit41
            webkit_dockerfile: development/desktop-wails-builder/Dockerfile
            webkit_builder_image: fse-desktop-wails-builder:debian12-wails2.10.2
          - target: linux-arm64
            goarch: arm64
            runner: ubuntu-24.04-arm
            appimagetool: appimagetool-aarch64.AppImage
            webkit_api: '4.1'
            webkit_slug: webkit41
            webkit_dockerfile: development/desktop-wails-builder/Dockerfile
            webkit_builder_image: fse-desktop-wails-builder:debian12-wails2.10.2
          - target: linux-amd64
            goarch: amd64
            runner: ubuntu-latest
            appimagetool: appimagetool-x86_64.AppImage
            webkit_api: '4.0'
            webkit_slug: webkit40
            webkit_dockerfile: development/desktop-wails-builder/Dockerfile.linux-webkit40
            webkit_builder_image: fse-desktop-wails-builder:debian12-wails2.10.2-linux-webkit40
          - target: linux-arm64
            goarch: arm64
            runner: ubuntu-24.04-arm
            appimagetool: appimagetool-aarch64.AppImage
            webkit_api: '4.0'
            webkit_slug: webkit40
            webkit_dockerfile: development/desktop-wails-builder/Dockerfile.linux-webkit40
            webkit_builder_image: fse-desktop-wails-builder:debian12-wails2.10.2-linux-webkit40
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version
        id: version
        shell: bash
        run: |
          version="${{ needs.version-preflight.outputs.version }}"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Build cross-platform daemon binaries
        run: scripts/build-all.sh "${{ steps.version.outputs.version }}"

      - name: Package desktop engine resources
        run: scripts/package-desktop-engine-resources.sh "${{ steps.version.outputs.version }}"

      - name: Build Linux Wails builder image for WebKitGTK ABI lane
        shell: bash
        run: |
          docker build \
            -t "${{ matrix.webkit_builder_image }}" \
            -f "${{ matrix.webkit_dockerfile }}" \
            development/desktop-wails-builder

      - name: Install Linux desktop packaging tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm zip file ca-certificates curl
          mkdir -p "$RUNNER_TEMP/appimage"
          curl -fsSL -o "$RUNNER_TEMP/appimage/${{ matrix.appimagetool }}" \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/${{ matrix.appimagetool }}"
          chmod +x "$RUNNER_TEMP/appimage/${{ matrix.appimagetool }}"

      - name: Build and package Linux desktop GUI WebKitGTK ABI variant
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          FSE_DESKTOP_APPIMAGETOOL: ${{ runner.temp }}/appimage/${{ matrix.appimagetool }}
          FSE_DESKTOP_LINUX_WEBKIT_VARIANTS: ${{ matrix.webkit_api }}
          FSE_DESKTOP_LINUX_WEBKIT_TARGETS: linux/${{ matrix.goarch }}
          FSE_DESKTOP_WAILS_BUILDER_IMAGE_LINUX_WEBKIT41: ${{ matrix.webkit_builder_image }}
          FSE_DESKTOP_WAILS_BUILDER_IMAGE_LINUX_WEBKIT40: ${{ matrix.webkit_builder_image }}
        run: scripts/build-package-desktop-linux-webkit-variants.sh "${{ steps.version.outputs.version }}"

      - name: Verify Linux desktop installer checksums
        shell: bash
        run: |
          cd "build/${{ steps.version.outputs.version }}/desktop-gui/linux-installers-${{ matrix.webkit_slug }}"
          sha256sum -c SHA256SUMS

      - name: Upload Linux desktop installer artifacts
        uses: actions/upload-artifact@v7
        with:
          name: fse-desktop-${{ matrix.target }}-${{ matrix.webkit_slug }}-installers-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: |
            build/${{ steps.version.outputs.version }}/desktop-gui/linux-installers-${{ matrix.webkit_slug }}/fse-desktop-${{ steps.version.outputs.version }}-${{ matrix.target }}.deb
            build/${{ steps.version.outputs.version }}/desktop-gui/linux-installers-${{ matrix.webkit_slug }}/fse-desktop-${{ steps.version.outputs.version }}-${{ matrix.target }}.rpm
            build/${{ steps.version.outputs.version }}/desktop-gui/linux-installers-${{ matrix.webkit_slug }}/fse-desktop-${{ steps.version.outputs.version }}-${{ matrix.target }}.AppImage
            build/${{ steps.version.outputs.version }}/desktop-gui/linux-installers-${{ matrix.webkit_slug }}/SHA256SUMS
          if-no-files-found: error

  windows-desktop-artifacts:
    needs: version-preflight
    name: Windows desktop installer artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version
        id: version
        shell: bash
        run: |
          version="${{ needs.version-preflight.outputs.version }}"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Build cross-platform daemon binaries
        run: scripts/build-all.sh "${{ steps.version.outputs.version }}"

      - name: Package desktop engine resources
        run: scripts/package-desktop-engine-resources.sh "${{ steps.version.outputs.version }}"

      - name: Install Windows desktop installer packaging tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nsis

      - name: Build Windows Wails builder images
        shell: bash
        run: |
          docker build \
            -t fse-desktop-wails-builder:debian12-wails2.10.2 \
            -f development/desktop-wails-builder/Dockerfile \
            development/desktop-wails-builder
          docker build \
            -t fse-desktop-wails-builder:debian12-wails2.10.2-windows-arm64-llvm-mingw \
            -f development/desktop-wails-builder/Dockerfile.windows-arm64-llvm-mingw \
            development/desktop-wails-builder

      - name: Build Windows desktop GUI Wails outputs
        env:
          FSE_DESKTOP_WAILS_BUILDER_IMAGE: fse-desktop-wails-builder:debian12-wails2.10.2
          FSE_DESKTOP_WAILS_BUILDER_IMAGE_WINDOWS_AMD64: fse-desktop-wails-builder:debian12-wails2.10.2
          FSE_DESKTOP_WAILS_BUILDER_IMAGE_WINDOWS_ARM64: fse-desktop-wails-builder:debian12-wails2.10.2-windows-arm64-llvm-mingw
          FSE_DESKTOP_WAILS_TARGETS: windows/amd64 windows/arm64
        run: scripts/build-desktop-gui-wails.sh "${{ steps.version.outputs.version }}"

      - name: Package Windows desktop installers
        env:
          FSE_DESKTOP_GUI_RELEASE_TARGETS: windows-amd64,windows-arm64
        run: scripts/package-desktop-gui-release.sh "${{ steps.version.outputs.version }}"

      - name: Verify Windows desktop installer checksums
        shell: bash
        run: |
          cd "build/${{ steps.version.outputs.version }}/desktop-gui"
          sha256sum -c SHA256SUMS

      - name: Upload Windows amd64 desktop zip package artifact
        uses: actions/upload-artifact@v7
        with:
          name: fse-desktop-windows-amd64-zip-package-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: |
            build/${{ steps.version.outputs.version }}/desktop-gui/fse-desktop-${{ steps.version.outputs.version }}-windows-amd64.zip
            build/${{ steps.version.outputs.version }}/desktop-gui/SHA256SUMS
          if-no-files-found: error

      - name: Upload Windows amd64 desktop installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: fse-desktop-windows-amd64-installer-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: |
            build/${{ steps.version.outputs.version }}/desktop-gui/fse-desktop-${{ steps.version.outputs.version }}-windows-amd64-installer.exe
            build/${{ steps.version.outputs.version }}/desktop-gui/SHA256SUMS
          if-no-files-found: error

      - name: Upload Windows arm64 desktop zip package artifact
        uses: actions/upload-artifact@v7
        with:
          name: fse-desktop-windows-arm64-zip-package-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: |
            build/${{ steps.version.outputs.version }}/desktop-gui/fse-desktop-${{ steps.version.outputs.version }}-windows-arm64.zip
            build/${{ steps.version.outputs.version }}/desktop-gui/SHA256SUMS
          if-no-files-found: error

      - name: Upload Windows arm64 desktop installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: fse-desktop-windows-arm64-installer-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: |
            build/${{ steps.version.outputs.version }}/desktop-gui/fse-desktop-${{ steps.version.outputs.version }}-windows-arm64-installer.exe
            build/${{ steps.version.outputs.version }}/desktop-gui/SHA256SUMS
          if-no-files-found: error

  macos-desktop-artifacts:
    needs: version-preflight
    name: macOS desktop installer artifacts (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: darwin-amd64
            runner: macos-15-intel
          - arch: arm64
            target: darwin-arm64
            runner: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go for daemon builds
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Resolve version
        id: version
        shell: bash
        run: |
          version="${{ needs.version-preflight.outputs.version }}"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Install macOS packaging checksum tools
        shell: bash
        run: |
          brew install coreutils
          if [ -d /opt/homebrew/opt/coreutils/libexec/gnubin ]; then
            echo "/opt/homebrew/opt/coreutils/libexec/gnubin" >> "$GITHUB_PATH"
          fi
          if [ -d /usr/local/opt/coreutils/libexec/gnubin ]; then
            echo "/usr/local/opt/coreutils/libexec/gnubin" >> "$GITHUB_PATH"
          fi

      - name: Build cross-platform daemon binaries
        run: scripts/build-all.sh "${{ steps.version.outputs.version }}"

      - name: Set up Go for Wails desktop build
        uses: actions/setup-go@v6
        with:
          go-version-file: desktop-gui/go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            desktop-gui/go.sum

      - name: Install Wails CLI and packaging tools
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Package desktop engine resources
        run: scripts/package-desktop-engine-resources.sh "${{ steps.version.outputs.version }}"

      - name: Build native macOS desktop GUI output
        env:
          FSE_DESKTOP_MACOS_ARCH: ${{ matrix.arch }}
        run: scripts/build-desktop-gui-wails-native-macos.sh "${{ steps.version.outputs.version }}"

      - name: Package macOS desktop installer
        env:
          FSE_DESKTOP_GUI_RELEASE_TARGETS: darwin-${{ matrix.arch }}
        run: scripts/package-desktop-gui-release.sh "${{ steps.version.outputs.version }}"

      - name: Verify macOS desktop installer checksum
        shell: bash
        run: |
          cd "build/${{ steps.version.outputs.version }}/desktop-gui"
          sha256sum -c SHA256SUMS

      - name: Upload macOS desktop installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: fse-desktop-${{ matrix.target }}-installer-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: |
            build/${{ steps.version.outputs.version }}/desktop-gui/fse-desktop-${{ steps.version.outputs.version }}-darwin-${{ matrix.arch }}.zip
            build/${{ steps.version.outputs.version }}/desktop-gui/SHA256SUMS
          if-no-files-found: error

  publish-container:
    name: Build, publish, and verify GHCR image
    runs-on: ubuntu-latest
    needs:
      - version-preflight
      - linux-release-artifacts
      - linux-desktop-artifacts
      - windows-desktop-artifacts
      - macos-desktop-artifacts
    outputs:
      image: ${{ steps.image-ref.outputs.repository }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Download same-run Linux daemon artifacts for Docker image
        uses: actions/download-artifact@v7
        with:
          path: ${{ runner.temp }}/daemon-artifacts
          pattern: file-sync-engine-daemon-linux-*-${{ needs.version-preflight.outputs.version }}-${{ github.sha }}
          merge-multiple: false
      - name: Verify and stage same-run Linux daemon artifacts
        shell: bash
        env:
          ARTIFACT_ROOT: ${{ runner.temp }}/daemon-artifacts
        run: |
          set -euo pipefail
          rm -rf docker-artifacts
          mkdir -p docker-artifacts
          for binary in fse-linux-amd64 fse-linux-arm64 fse-linux-armv7; do
            mapfile -t matches < <(find "$ARTIFACT_ROOT" -type f -name "$binary" -print)
            if [[ "${#matches[@]}" -ne 1 ]]; then
              printf 'expected exactly one same-run release artifact named %s, found %s\n' "$binary" "${#matches[@]}" >&2
              exit 1
            fi
            binary_path="${matches[0]}"
            checksum_path="$(dirname "$binary_path")/SHA256SUMS"
            if [[ ! -f "$checksum_path" ]]; then
              printf 'missing SHA256SUMS beside same-run release artifact: %s\n' "$binary_path" >&2
              exit 1
            fi
            expected="$(awk -v name="$binary" '$2 == name { print $1 }' "$checksum_path")"
            if [[ ! "$expected" =~ ^[0-9a-f]{64}$ ]]; then
              printf 'missing or invalid checksum for %s\n' "$binary" >&2
              exit 1
            fi
            actual="$(sha256sum "$binary_path" | awk '{ print $1 }')"
            if [[ "$actual" != "$expected" ]]; then
              printf 'checksum mismatch for same-run release artifact %s\n' "$binary" >&2
              exit 1
            fi
            install -m 0755 "$binary_path" "docker-artifacts/$binary"
          done
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve lowercase GHCR repository
        id: image-ref
        shell: bash
        run: printf 'repository=ghcr.io/%s\n' "${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build and push synchronized release image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image-ref.outputs.repository }}:${{ needs.version-preflight.outputs.version }}
            ${{ steps.image-ref.outputs.repository }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.version=${{ needs.version-preflight.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.image-ref.outputs.repository }}
          VERSION: ${{ needs.version-preflight.outputs.version }}
        run: cosign sign --yes "${IMAGE}:${VERSION}@${DIGEST}"
      - name: Verify image signature
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.image-ref.outputs.repository }}
          VERSION: ${{ needs.version-preflight.outputs.version }}
        run: |
          cosign verify "${IMAGE}:${VERSION}@${DIGEST}" \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

  publish-github-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - version-preflight
      - linux-release-artifacts
      - web-gui-package
      - linux-desktop-artifacts
      - windows-desktop-artifacts
      - macos-desktop-artifacts
      - publish-container
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          version="${{ needs.version-preflight.outputs.version }}"
          tag="${{ needs.version-preflight.outputs.tag }}"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-artifacts
          # docker/build-push-action uploads a build-record artifact by default;
          # it is not a distributable release asset and can fail archive extraction.
          pattern: "!*.dockerbuild"

      - name: Stage release assets
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          mkdir -p release-assets
          find release-artifacts -maxdepth 3 -type f -print0 | while IFS= read -r -d '' file; do
            base="$(basename "$file")"
            if [[ "$base" == "SHA256SUMS" ]]; then
              continue
            fi
            artifact_dir="$(basename "$(dirname "$file")")"
            stem="${artifact_dir%-${GITHUB_SHA}}"
            if [[ "$base" == *.* ]]; then
              ext=".${base##*.}"
            else
              ext=""
            fi
            dest="release-assets/${stem}${ext}"
            if [[ -e "$dest" ]]; then
              printf 'release asset name collision: %s\n' "$dest" >&2
              exit 1
            fi
            cp "$file" "$dest"
          done
          cd release-assets
          sha256sum * > RELEASE_ASSET_SHA256SUMS
          ls -la

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          notes_file="$RUNNER_TEMP/release-notes.md"
          cat > "$notes_file" <<NOTES
          Automated File Sync Engine release $VERSION.

          This release contains daemon and desktop GUI build artifacts produced by GitHub Actions for Linux, Windows, and macOS targets, plus the matching signed GHCR image `${{ needs.publish-container.outputs.image }}:$VERSION` (digest `${{ needs.publish-container.outputs.digest }}`). Linux desktop installers include both WebKitGTK ABI lanes where applicable.
          NOTES

          if gh release view "$TAG" >/dev/null 2>&1; then
            printf 'refusing to publish duplicate release %s; preflight should have stopped this run before builds\n' "$TAG" >&2
            exit 1
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "File Sync Engine $VERSION" --notes-file "$notes_file"
          gh release upload "$TAG" release-assets/*
